# Tests mit künstlichen Daten (ohne Netz zu DWD, Copernicus, GeoNames, open flightmaps)
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_wind.py
      - run: python tests/test_gelaende_orte.py
      - run: python tests/test_veroeffentlichen.py
      - run: python tests/test_luftraum.py
      - run: python tests/test_pisten.py

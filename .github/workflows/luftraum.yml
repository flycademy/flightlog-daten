# Lufträume, Flugplätze und VFR-Meldepunkte Deutschlands aus open flightmaps — täglich (laufender und nächster AIRAC-Zyklus;
# der nächste steht etwa eine Woche vor Beginn bereit) und von Hand.
# Dazu (ab Build 25w, Georgi 15.11.2026 Nr. 5) luftraum-dfs.bin: die Lufträume aus dem DFS-Datensatz ED Airspace, Flugplätze,
# Meldepunkte und Umriss weiter aus open flightmaps. luftraum.bin bleibt für ältere Builds.
# Hat open flightmaps gerade keine Datei für den laufenden Zyklus (so am 17.11.2026 nachmittags), nimmt der Job Flugplätze,
# Meldepunkte und Umriss aus dem letzten erfolgreichen Lauf und legt die Lufträume der DFS trotzdem frisch ab.
name: Luftraum
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "für den Flight Log veröffentlichen (Download im Release „daten“, den der Server abholt)"
        type: boolean
        default: true
      ergebnis:
        description: "Ergebnis zusätzlich verschlüsselt im Zweig ergebnis-luftraum ablegen (zur Prüfung)"
        type: boolean
        default: false
      pruefschluessel:
        description: "öffentlicher Prüfschlüssel (FCY-OEFFENTLICH-1 …): das Ergebnis im Zweig wird damit verschlüsselt; ohne ihn kein Ergebnis"
        type: string
        default: ""
permissions:
  contents: write
jobs:
  luftraum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lufträume des vorigen Laufs (Zwischenspeicher)
        uses: actions/cache/restore@v4
        with:
          path: vorrat/luftraum.bin
          key: luftraum-umriss-${{ github.run_id }}
          restore-keys: luftraum-umriss-
      - name: Lufträume aufbereiten (open flightmaps; fehlt die Datei, der letzte gute Stand)
        id: lr
        run: bash werkzeug/lauf.sh bash werkzeug/luftraum_umriss.sh out/luftraum.bin vorrat/luftraum.bin
      - name: Lufträume für den nächsten Lauf merken
        if: steps.lr.outputs.frisch == 'ja'
        uses: actions/cache/save@v4
        with:
          path: vorrat/luftraum.bin
          key: luftraum-umriss-${{ github.run_id }}
      - name: Prüfen
        run: bash werkzeug/lauf.sh python -m fcy_daten.pruefen luftraum out/luftraum.bin
      - name: Veröffentlichen
        # nur einen frisch gerechneten Stand; der vorige liegt schon im Release
        if: (github.event_name == 'schedule' || inputs.veroeffentlichen) && steps.lr.outputs.frisch == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
          FCY_OFFEN: ${{ vars.FCY_OFFEN }}
        run: bash werkzeug/lauf.sh python -m fcy_daten.veroeffentlichen out/luftraum.bin
      - name: Lufträume der DFS dazu (luftraum-dfs.bin)
        run: bash werkzeug/lauf.sh python -m fcy_daten.luftraum_dfs --ofm out/luftraum.bin --aus out/luftraum-dfs.bin
      - name: Prüfen (DFS)
        run: bash werkzeug/lauf.sh python -m fcy_daten.pruefen luftraum-dfs out/luftraum-dfs.bin
      - name: Veröffentlichen (DFS)
        if: github.event_name == 'schedule' || inputs.veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          FCY_OFFEN: ${{ vars.FCY_OFFEN }}
        run: bash werkzeug/lauf.sh python -m fcy_daten.veroeffentlichen out/luftraum-dfs.bin
      - name: Ergebnis ablegen
        if: github.event_name == 'workflow_dispatch' && inputs.ergebnis
        env:
          FCY_PRUEFSCHLUESSEL: ${{ inputs.pruefschluessel }}
        run: bash werkzeug/ergebnis.sh ergebnis-luftraum out/luftraum.bin out/luftraum-dfs.bin

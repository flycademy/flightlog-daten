# Höhenwind und Modellwetter aus DWD ICON-D2 — alle 3 Stunden, rund 2¼ Stunden nach Laufbeginn
name: Wind ICON-D2
on:
  schedule:
    - cron: "17 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      hochladen:
        description: "auf den Server hochladen"
        type: boolean
        default: true
      ergebnis:
        description: "Ergebnis zusätzlich im Zweig ergebnis-wind ablegen (zur Prüfung)"
        type: boolean
        default: false
concurrency:
  group: wind
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: hhl-icon-d2-v1
      - name: Wind rechnen
        run: bash werkzeug/lauf.sh python -m fcy_daten.wind --aus out/wind.bin --hhl-cache cache/hhl.npz
      - name: Prüfen
        run: bash werkzeug/lauf.sh python -m fcy_daten.pruefen wind out/wind.bin --vergleich
      - name: Hochladen
        if: github.event_name == 'schedule' || inputs.hochladen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: bash werkzeug/lauf.sh python -m fcy_daten.hochladen out/wind.bin wx/wind.bin
      - name: Ergebnis ablegen
        if: github.event_name == 'workflow_dispatch' && inputs.ergebnis
        run: bash werkzeug/ergebnis.sh ergebnis-wind out/wind.bin

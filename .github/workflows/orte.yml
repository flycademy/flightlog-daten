# Ortsnamen aus GeoNames — monatlich (GeoNames ändert sich langsam) und von Hand
name: Orte
on:
  schedule:
    - cron: "41 3 2 * *"
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "für den Flight Log veröffentlichen (Download im Release „daten“, den der Server abholt)"
        type: boolean
        default: true
      ergebnis:
        description: "Ergebnis zusätzlich im Zweig ergebnis-orte ablegen (zur Prüfung)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  orte:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Orte aufbereiten
        run: bash werkzeug/lauf.sh python -m fcy_daten.orte --aus out/orte.bin
      - name: Prüfen
        run: bash werkzeug/lauf.sh python -m fcy_daten.pruefen orte out/orte.bin
      - name: Veröffentlichen
        if: github.event_name == 'schedule' || inputs.veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash werkzeug/lauf.sh python -m fcy_daten.veroeffentlichen out/orte.bin
      - name: Ergebnis ablegen
        if: github.event_name == 'workflow_dispatch' && inputs.ergebnis
        run: bash werkzeug/ergebnis.sh ergebnis-orte out/orte.bin
